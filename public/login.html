<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 · QQ 伙伴</title><link rel="stylesheet" href="/qq-companion/style.css"><script defer src="/qq-companion/login.js"></script></head><body class="login-page"><article class="login-card"><span class="eyebrow">QQ COMPANION · 本地服务</span><h1>欢迎回来</h1><p class="muted">输入环境变量中配置的密码，查看伙伴的状态与记忆。</p><form id="login-form" class="form"><label>登录密码<input name="password" type="password" autocomplete="current-password" required autofocus></label><button class="primary">进入管理页</button></form><p id="notice" role="alert"></p><p class="muted">在项目的 <code>.env</code> 或 <code>.env.local</code> 中设置密码，默认变量名为 <code>QQ_ADMIN_PASSWORD</code>；若已自定义，以配置中的 <code>adminPasswordEnv</code> 为准。重启后生效。</p></article></body></html>
